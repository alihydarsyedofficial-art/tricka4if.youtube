name: Build YT Float Branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npx electron-builder --win portable
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Float-Windows-EXE
          path: dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install
      - run: npm run build
      - run: npx cap add android "YT Pure Float" --app-id com.tricka4if.venomyt
      - run: |
          mkdir -p android/app/src/main/java/com/tricka4if/venomyt
          cp android-native/MainActivity.kt android/app/src/main/java/com/tricka4if/venomyt/MainActivity.kt
          sed -i 's/<activity /<activity android:supportsPictureInPicture="true" android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation" /g' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YT-Float-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
