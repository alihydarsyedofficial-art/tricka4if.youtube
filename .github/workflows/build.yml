name: Build YT Pure Float (Windows EXE & Android APK)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-multi-target:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web bundle (dist)
        run: npm run build

      - name: Build Windows Portable EXE
        run: npx electron-builder --win portable --x64

      - name: Setup JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor Android platform & inject native code
        run: |
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/java/com/tricka4if/venomyt
          cp android-native/MainActivity.kt android/app/src/main/java/com/tricka4if/venomyt/MainActivity.kt

      - name: Configure Picture-in-Picture in AndroidManifest.xml
        run: |
          python3 - << 'EOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          pip_attrs = (
              'android:supportsPictureInPicture="true" '
              'android:resizeableActivity="true" '
              'android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode" '
          )

          if 'android:supportsPictureInPicture="true"' not in content:
              content = content.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity" ' + pip_attrs
              )

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Sync Capacitor assets to Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload Windows Portable EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Pure-Float-Windows-Portable
          path: release/*.exe
          if-no-files-found: error

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Pure-Float-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
